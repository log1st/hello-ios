# Проект собирается XcodeGen'ом из этого файла, а не лежит в репозитории.
#
# Причина та же, что и в log1st/jarvis-ios: pbxproj нечитаем, конфликтует при
# каждом слиянии и правится вслепую, а машина, на которой это написано, Xcode не
# имеет вовсе и проверить pbxproj не может никак. Генератор ставится одной
# строкой и на раннере, и локально: brew install xcodegen && xcodegen generate

name: HelloTrust
options:
  bundleIdPrefix: com.log1st
  deploymentTarget:
    # 18.0 намеренно: приложение с таким таргетом ставится и на 18, и на 26, и на
    # 27 beta. Поднимать планку до 26 незачем — это только отрезало бы устройства.
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  HelloTrust:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.log1st.hellotrust
        INFOPLIST_KEY_CFBundleDisplayName: HelloTrust
